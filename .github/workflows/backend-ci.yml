name: Backend CI

on:
  push:
    branches: [main, 001-docusaurus-textbook]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8 (optional)
        working-directory: backend
        continue-on-error: true
        run: |
          pip install flake8
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check imports
        working-directory: backend
        run: |
          python -c "from src.main import app; print('FastAPI app imports successfully')"

  build-check:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify FastAPI app starts
        working-directory: backend
        run: |
          timeout 10 python -m uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
          curl -f http://localhost:8000/health || exit 1
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          GOOGLE_API_KEY: "test-key"
          QDRANT_URL: "http://localhost:6333"
          QDRANT_API_KEY: "test-key"
          JWT_SECRET_KEY: "test-secret-key-for-ci"
        continue-on-error: true
